name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Every run deploys its OWN ephemeral sandbox (`ci-<run_id>`), seeds it, tests
# against it, and the final `teardown` job deletes it whatever happened — so CI
# never depends on a developer sandbox and leaves no standing AWS cost. Runs no
# longer share a backend, so the old single global group is gone; we group per
# PR/ref only so a burst of pushes queues instead of stacking sandboxes. Never
# cancel in progress: a cancelled run would still tear down, but the next push
# would redeploy from scratch for nothing.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

# Every job resolves the SAME sandbox from this (scripts/sandbox.mjs sanitizes it
# to `ci<run_id>` and derives the deterministic stack name). The scheduled sweep
# in sandbox-cleanup.yml only ever deletes stacks matching this `ci<digits>` shape.
env:
  SANDBOX_IDENTIFIER: ci-${{ github.run_id }}

jobs:
  sandbox:
    # Deploy THIS run's own sandbox. Every other job reads it, and `teardown`
    # deletes it. The script fails on a rolled-back stack even when ampx exits 0.
    name: Deploy ephemeral sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Configure AWS "personal" profile
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          mkdir -p ~/.aws
          printf '[personal]\naws_access_key_id=%s\naws_secret_access_key=%s\n' \
            "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" > ~/.aws/credentials
          printf '[profile personal]\nregion=us-west-2\n' > ~/.aws/config
      - name: Deploy the per-run sandbox
        run: npm run sandbox:deploy

  quality:
    name: Lint, Test, Coverage, CRAP & Build
    needs: sandbox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS "personal" profile
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          mkdir -p ~/.aws
          printf '[personal]\naws_access_key_id=%s\naws_secret_access_key=%s\n' \
            "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" > ~/.aws/credentials
          printf '[profile personal]\nregion=us-west-2\n' > ~/.aws/config

      - name: Generate amplify_outputs.json (sandbox)
        run: npm run e2e-config

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: File-length discipline (max 100 lines)
        run: npm run check:lines

      - name: Acceptance-coverage guard
        run: npm run check:features

      - name: Unit tests with coverage (80% floor)
        run: npm run test:coverage

      - name: CRAP score analysis (threshold 15)
        run: npm run crap

      - name: Build
        run: npm run build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  seed:
    # Acceptance tests run against this run's own sandbox, seeded fresh here so
    # every run starts from an identical, bounded state.
    name: Seed sandbox
    needs: sandbox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Configure AWS "personal" profile
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          mkdir -p ~/.aws
          printf '[personal]\naws_access_key_id=%s\naws_secret_access_key=%s\n' \
            "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" > ~/.aws/credentials
          printf '[profile personal]\nregion=us-west-2\n' > ~/.aws/config
      - name: Generate amplify_outputs.json (sandbox)
        run: npm run e2e-config
      # A fresh sandbox has a brand-new, EMPTY Cognito pool: create the test
      # account (confirmed, permanent password) before the seed signs in as it.
      - name: Create the test user in the fresh Cognito pool
        env:
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: npm run sandbox:ensure-user
      - name: Seed the sandbox to a known state
        env:
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: npm run seed

  acceptance:
    name: Acceptance Tests (${{ matrix.area.name }})
    needs: seed
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        area:
          - name: auth
            paths: .features-gen/e2e/features/auth/
          - name: projects
            paths: .features-gen/e2e/features/projects/
          - name: board
            paths: .features-gen/e2e/features/board/
          - name: list
            paths: .features-gen/e2e/features/list/
          - name: task
            paths: .features-gen/e2e/features/task/
          - name: approval
            paths: .features-gen/e2e/features/approval/
          - name: follow
            paths: .features-gen/e2e/features/follow/
          - name: mytasks
            paths: .features-gen/e2e/features/mytasks/
          - name: search
            paths: .features-gen/e2e/features/search/
          - name: labels
            paths: .features-gen/e2e/features/labels/
          - name: assign
            paths: .features-gen/e2e/features/assign/
          - name: filter
            paths: .features-gen/e2e/features/filter/
          - name: sections
            paths: .features-gen/e2e/features/sections/
          - name: delete
            paths: .features-gen/e2e/features/delete/
          - name: reorder
            paths: .features-gen/e2e/features/reorder/
          - name: archive
            paths: .features-gen/e2e/features/archive/
          - name: calendar
            paths: .features-gen/e2e/features/calendar/
          - name: counts
            paths: .features-gen/e2e/features/counts/
          - name: completed
            paths: .features-gen/e2e/features/completed/
          - name: quickedit
            paths: .features-gen/e2e/features/quickedit/
          - name: templates
            paths: .features-gen/e2e/features/templates/
          - name: rename
            paths: .features-gen/e2e/features/rename/
          - name: sectionmove
            paths: .features-gen/e2e/features/sectionmove/
          - name: activity
            paths: .features-gen/e2e/features/activity/
          - name: home
            paths: .features-gen/e2e/features/home/
          - name: duepresets
            paths: .features-gen/e2e/features/duepresets/
          - name: richnotes
            paths: .features-gen/e2e/features/richnotes/
          - name: bulk
            paths: .features-gen/e2e/features/bulk/
          - name: boardbulk
            paths: .features-gen/e2e/features/boardbulk/
          - name: dragdrop
            paths: .features-gen/e2e/features/dragdrop/
          - name: undo
            paths: .features-gen/e2e/features/undo/
          - name: shortcuts
            paths: .features-gen/e2e/features/shortcuts/
          - name: dependencies
            paths: .features-gen/e2e/features/dependencies/
          - name: recurring
            paths: .features-gen/e2e/features/recurring/
          - name: duetime
            paths: .features-gen/e2e/features/duetime/
          - name: attachments
            paths: .features-gen/e2e/features/attachments/
          - name: reorderdrag
            paths: .features-gen/e2e/features/reorderdrag/
          - name: focus
            paths: .features-gen/e2e/features/focus/
          - name: startdate
            paths: .features-gen/e2e/features/startdate/
          - name: milestone
            paths: .features-gen/e2e/features/milestone/
          - name: progress
            paths: .features-gen/e2e/features/progress/
          - name: duplicate
            paths: .features-gen/e2e/features/duplicate/
          - name: mytasksdone
            paths: .features-gen/e2e/features/mytasksdone/
          - name: searchfilter
            paths: .features-gen/e2e/features/searchfilter/
          - name: archivedview
            paths: .features-gen/e2e/features/archivedview/
          - name: moveproject
            paths: .features-gen/e2e/features/moveproject/
          - name: subtaskchip
            paths: .features-gen/e2e/features/subtaskchip/
          - name: collapsepersist
            paths: .features-gen/e2e/features/collapsepersist/
          - name: taskcolor
            paths: .features-gen/e2e/features/taskcolor/
          - name: commentdelete
            paths: .features-gen/e2e/features/commentdelete/
          - name: commentedit
            paths: .features-gen/e2e/features/commentedit/
          - name: commentlike
            paths: .features-gen/e2e/features/commentlike/
          - name: commenttime
            paths: .features-gen/e2e/features/commenttime/
          - name: bulkmove
            paths: .features-gen/e2e/features/bulkmove/
          - name: copylink
            paths: .features-gen/e2e/features/copylink/
          - name: subtasknav
            paths: .features-gen/e2e/features/subtasknav/
          - name: projectchip
            paths: .features-gen/e2e/features/projectchip/
          - name: searchrich
            paths: .features-gen/e2e/features/searchrich/
          - name: members
            paths: .features-gen/e2e/features/members/
          - name: celebration
            paths: .features-gen/e2e/features/celebration/
          - name: likes
            paths: .features-gen/e2e/features/likes/
          - name: savedviews
            paths: .features-gen/e2e/features/savedviews/
          - name: customfields
            paths: .features-gen/e2e/features/customfields/
          - name: timeline
            paths: .features-gen/e2e/features/timeline/
          - name: projectstatus
            paths: .features-gen/e2e/features/projectstatus/
          - name: statusupdates
            paths: .features-gen/e2e/features/statusupdates/
          - name: keyresources
            paths: .features-gen/e2e/features/keyresources/
          - name: duplicateproject
            paths: .features-gen/e2e/features/duplicateproject/
          - name: promote
            paths: .features-gen/e2e/features/promote/
          - name: sectioncopy
            paths: .features-gen/e2e/features/sectioncopy/
          - name: profile
            paths: .features-gen/e2e/features/profile/
          - name: cover
            paths: .features-gen/e2e/features/cover/
          - name: mentions
            paths: .features-gen/e2e/features/mentions/
          - name: boardcollapse
            paths: .features-gen/e2e/features/boardcollapse/
          - name: activitylog
            paths: .features-gen/e2e/features/activitylog/
          - name: projectcopylink
            paths: .features-gen/e2e/features/projectcopylink/
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS "personal" profile
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          mkdir -p ~/.aws
          printf '[personal]\naws_access_key_id=%s\naws_secret_access_key=%s\n' \
            "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" > ~/.aws/credentials
          printf '[profile personal]\nregion=us-west-2\n' > ~/.aws/config

      - name: Generate amplify_outputs.json (sandbox)
        run: npm run e2e-config

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run acceptance tests (${{ matrix.area.name }})
        env:
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: npx bddgen && npx playwright test ${{ matrix.area.paths }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.area.name }}
          path: playwright-report/
          retention-days: 7

  teardown:
    # ALWAYS delete this run's sandbox — after success, failure, or cancellation,
    # on PRs and on main alike. `needs` makes it wait for every job that uses the
    # sandbox; `if: always()` makes it run even when they failed or were skipped
    # (including when the deploy itself failed half-way). The delete waits out
    # an in-flight deploy, treats "no stack" as success, and fails this job (and
    # so the run) if the stack is still there afterwards. Anything that slips
    # through is reaped by the scheduled sweep in sandbox-cleanup.yml.
    name: Tear down ephemeral sandbox
    needs: [sandbox, quality, seed, acceptance]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Configure AWS "personal" profile
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          mkdir -p ~/.aws
          printf '[personal]\naws_access_key_id=%s\naws_secret_access_key=%s\n' \
            "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" > ~/.aws/credentials
          printf '[profile personal]\nregion=us-west-2\n' > ~/.aws/config
      - name: Delete the per-run sandbox
        run: npm run sandbox:delete
