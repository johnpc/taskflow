name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Acceptance tests seed + read ONE shared sandbox backend (clearAll + reseed
# each run). Two CI runs overlapping there race: one run's clearAll wipes rows
# mid-read in the other's test. A SINGLE global group serializes every CI run so
# only one owns the sandbox at a time. Don't cancel in progress: a running suite
# must finish its clear→seed→read cycle uncorrupted before the next starts.
concurrency:
  group: ci-shared-sandbox
  cancel-in-progress: false

jobs:
  quality:
    name: Lint, Test, Coverage, CRAP & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS "personal" profile
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          mkdir -p ~/.aws
          printf '[personal]\naws_access_key_id=%s\naws_secret_access_key=%s\n' \
            "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" > ~/.aws/credentials
          printf '[profile personal]\nregion=us-west-2\n' > ~/.aws/config

      - name: Generate amplify_outputs.json (sandbox)
        run: npm run e2e-config

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: File-length discipline (max 100 lines)
        run: npm run check:lines

      - name: Acceptance-coverage guard
        run: npm run check:features

      - name: Unit tests with coverage (80% floor)
        run: npm run test:coverage

      - name: CRAP score analysis (threshold 15)
        run: npm run crap

      - name: Build
        run: npm run build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  seed:
    name: Seed sandbox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Configure AWS "personal" profile
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          mkdir -p ~/.aws
          printf '[personal]\naws_access_key_id=%s\naws_secret_access_key=%s\n' \
            "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" > ~/.aws/credentials
          printf '[profile personal]\nregion=us-west-2\n' > ~/.aws/config
      - name: Generate amplify_outputs.json (sandbox)
        run: npm run e2e-config
      - name: Seed the sandbox to a known state
        env:
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: npm run seed

  acceptance:
    name: Acceptance Tests (${{ matrix.area.name }})
    needs: seed
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        area:
          - name: auth
            paths: .features-gen/e2e/features/auth
          - name: projects
            paths: .features-gen/e2e/features/projects
          - name: board
            paths: .features-gen/e2e/features/board
          - name: list
            paths: .features-gen/e2e/features/list
          - name: task
            paths: .features-gen/e2e/features/task
          - name: mytasks
            paths: .features-gen/e2e/features/mytasks
          - name: search
            paths: .features-gen/e2e/features/search
          - name: labels
            paths: .features-gen/e2e/features/labels
          - name: assign
            paths: .features-gen/e2e/features/assign
          - name: filter
            paths: .features-gen/e2e/features/filter
          - name: sections
            paths: .features-gen/e2e/features/sections
          - name: delete
            paths: .features-gen/e2e/features/delete
          - name: reorder
            paths: .features-gen/e2e/features/reorder
          - name: archive
            paths: .features-gen/e2e/features/archive
          - name: calendar
            paths: .features-gen/e2e/features/calendar
          - name: counts
            paths: .features-gen/e2e/features/counts
          - name: completed
            paths: .features-gen/e2e/features/completed
          - name: quickedit
            paths: .features-gen/e2e/features/quickedit
          - name: templates
            paths: .features-gen/e2e/features/templates
          - name: rename
            paths: .features-gen/e2e/features/rename
          - name: sectionmove
            paths: .features-gen/e2e/features/sectionmove
          - name: activity
            paths: .features-gen/e2e/features/activity
          - name: home
            paths: .features-gen/e2e/features/home
          - name: duepresets
            paths: .features-gen/e2e/features/duepresets
          - name: richnotes
            paths: .features-gen/e2e/features/richnotes
          - name: bulk
            paths: .features-gen/e2e/features/bulk
          - name: dragdrop
            paths: .features-gen/e2e/features/dragdrop
          - name: undo
            paths: .features-gen/e2e/features/undo
          - name: shortcuts
            paths: .features-gen/e2e/features/shortcuts
          - name: dependencies
            paths: .features-gen/e2e/features/dependencies
          - name: recurring
            paths: .features-gen/e2e/features/recurring
          - name: duetime
            paths: .features-gen/e2e/features/duetime
          - name: attachments
            paths: .features-gen/e2e/features/attachments
          - name: reorderdrag
            paths: .features-gen/e2e/features/reorderdrag
          - name: focus
            paths: .features-gen/e2e/features/focus
          - name: startdate
            paths: .features-gen/e2e/features/startdate
          - name: milestone
            paths: .features-gen/e2e/features/milestone
          - name: progress
            paths: .features-gen/e2e/features/progress
          - name: duplicate
            paths: .features-gen/e2e/features/duplicate
          - name: mytasksdone
            paths: .features-gen/e2e/features/mytasksdone
          - name: searchfilter
            paths: .features-gen/e2e/features/searchfilter
          - name: archivedview
            paths: .features-gen/e2e/features/archivedview
          - name: moveproject
            paths: .features-gen/e2e/features/moveproject
          - name: subtaskchip
            paths: .features-gen/e2e/features/subtaskchip
          - name: collapsepersist
            paths: .features-gen/e2e/features/collapsepersist
          - name: taskcolor
            paths: .features-gen/e2e/features/taskcolor
          - name: commentdelete
            paths: .features-gen/e2e/features/commentdelete
          - name: commentedit
            paths: .features-gen/e2e/features/commentedit
          - name: commenttime
            paths: .features-gen/e2e/features/commenttime
          - name: bulkmove
            paths: .features-gen/e2e/features/bulkmove
          - name: copylink
            paths: .features-gen/e2e/features/copylink
          - name: subtasknav
            paths: .features-gen/e2e/features/subtasknav
          - name: projectchip
            paths: .features-gen/e2e/features/projectchip
          - name: searchrich
            paths: .features-gen/e2e/features/searchrich
          - name: members
            paths: .features-gen/e2e/features/members
          - name: celebration
            paths: .features-gen/e2e/features/celebration
          - name: savedviews
            paths: .features-gen/e2e/features/savedviews
          - name: customfields
            paths: .features-gen/e2e/features/customfields
          - name: timeline
            paths: .features-gen/e2e/features/timeline
          - name: projectstatus
            paths: .features-gen/e2e/features/projectstatus
          - name: duplicateproject
            paths: .features-gen/e2e/features/duplicateproject
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS "personal" profile
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          mkdir -p ~/.aws
          printf '[personal]\naws_access_key_id=%s\naws_secret_access_key=%s\n' \
            "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" > ~/.aws/credentials
          printf '[profile personal]\nregion=us-west-2\n' > ~/.aws/config

      - name: Generate amplify_outputs.json (sandbox)
        run: npm run e2e-config

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run acceptance tests (${{ matrix.area.name }})
        env:
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: npx bddgen && npx playwright test ${{ matrix.area.paths }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.area.name }}
          path: playwright-report/
          retention-days: 7
